services:
  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG}
    ports:
      - "${OLLAMA_PORT}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: ${OLLAMA_HEALTHCHECK_INTERVAL}
      timeout: ${OLLAMA_HEALTHCHECK_TIMEOUT}
      retries: ${OLLAMA_HEALTHCHECK_RETRIES}

  ollama-pull:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG}
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${OLLAMA_MODEL}"]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      OLLAMA_HOST: http://ollama:11434
    # UI + A2A endpoint, published on loopback only.
    ports:
      - "127.0.0.1:${UI_PORT}:8000"
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  ollama-data:

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: autocode
          POSTGRES_PASSWORD: autocode
          POSTGRES_DB: autocode
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U autocode" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://autocode:autocode@localhost:5432/autocode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt ruff
      - run: ruff check agent_platform tests app.py --select F,E9,B
      - run: python -m pytest -q

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
